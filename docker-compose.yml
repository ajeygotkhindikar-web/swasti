# Local / single-host deployment. For production use managed PostgreSQL, a secrets manager and TLS termination.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: sampurna, POSTGRES_USER: sampurna, POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me} }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sampurna"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sampurna:${DB_PASSWORD:-change-me}@db:5432/sampurna
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TRANSCRIPT_ENCRYPTION_KEY: ${TRANSCRIPT_ENCRYPTION_KEY:?set TRANSCRIPT_ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_FLAGS: ${SEED_FLAGS:-}
    depends_on: { db: { condition: service_healthy } }
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes: { pgdata: {} }
