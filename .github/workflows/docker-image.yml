name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Build & smoke-test the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^TRANSCRIPT_ENCRYPTION_KEY=.*|TRANSCRIPT_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_')|" .env
          sed -i "s|^SEED_FLAGS=.*|SEED_FLAGS=--demo|" .env

      - name: Validate compose file
        run: docker compose config -q

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then echo; echo "healthy after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "App did not become healthy"; exit 1

      - name: Smoke test (frontend, login, dashboard, PDF)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q "<title>SWASTI"
          curl -fsS http://localhost:8080/manifest.webmanifest | grep -q '"short_name": "SWASTI"'
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"priya@swasti.demo","password":"Demo@1234"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8080/api/categories -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json; c=json.load(sys.stdin); assert len(c)==14, len(c); print("categories:", len(c))'
          curl -fsS http://localhost:8080/api/dashboard -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["has_data"] and len(d["cards"])==14; print("dashboard cards:", len(d["cards"]))'
          curl -fsS http://localhost:8080/api/reports/pdf -H "Authorization: Bearer $TOKEN" -o report.pdf
          head -c 4 report.pdf | grep -q '%PDF' && echo "PDF report OK"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.component }} image
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            context: ./backend
          - component: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/swasti-${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
